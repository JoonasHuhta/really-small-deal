<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#202830">
  <meta name="description" content="Really Small Deal. A small moment. A very long shadow. A playful story about a human and Ekskyysmi, their rather overprotective shadow.">
  <title>Really Small Deal — A small moment. A very long shadow.</title>
  <!-- link previews (WhatsApp, Discord, Signal, iMessage…): the first thing a friend sees is this card, not the game -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Really Small Deal">
  <meta property="og:description" content="You play the overprotective shadow of someone who just heard “oh, hi.” A funny game about taking small things very, very seriously.">
  <meta property="og:url" content="https://joonashuhta.github.io/really-small-deal/">
  <meta property="og:image" content="https://joonashuhta.github.io/really-small-deal/assets/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/game.css?v=0.43.2">
  <script>/* the immersive layout, before first paint, so a phone held sideways never flashes the wide one */
    try{if(matchMedia('(orientation:landscape) and (max-height:540px)').matches)document.documentElement.classList.add('immersive');}catch(e){}</script>
  <script src="assets/game.js?v=0.43.2" defer></script>
</head>
<body>
<main class="wrap">
  <header>
    <a class="wordmark" href="index.html" aria-label="Really Small Deal home"><svg class="logo-eyes" viewBox="0 0 64 64" aria-hidden="true"><path d="M44 44l13 13" stroke="#ebbd79" stroke-width="8" stroke-linecap="round"/><circle cx="28" cy="28" r="20" fill="#14111d" stroke="#f4eddf" stroke-width="6"/><ellipse cx="21.5" cy="27" rx="4.8" ry="6.4" fill="#faf4e5"/><ellipse cx="34.5" cy="27" rx="4.8" ry="6.4" fill="#faf4e5"/><g class="pupils"><circle cx="23" cy="28.2" r="2.2" fill="#14111d"/><circle cx="36" cy="28.2" r="2.2" fill="#14111d"/></g></svg><span>Really Small Deal<span class="logo-dot" aria-hidden="true">.</span></span></a>
    <button id="menu" type="button" aria-label="Menu and settings" aria-expanded="false" aria-controls="controls"><span aria-hidden="true">☰</span><span class="menu-label">Menu</span></button>
    <nav id="controls" aria-label="Game controls">
      <button id="sound" type="button" aria-pressed="true">Sound on</button>
      <button id="full" type="button" aria-pressed="false">Full screen</button>
      <button id="motion" type="button" aria-pressed="false">Less motion</button>
      <button id="textsize" type="button">Text size</button>
      <button id="slow" type="button" aria-pressed="false">Slow reality</button>
      <button id="journal" type="button" disabled>Dialogue</button>
      <button id="pause" type="button" disabled>Pause</button>
      <button id="restart" type="button">Restart</button>
    </nav>
  </header>
  <section class="game-frame" aria-label="Interactive story">
    <div class="scene-bar"><span id="chapter">A small social adventure</span><span id="perspective">YOU & YOUR SHADOW</span></div>
    <div class="stage">
      <canvas id="c" aria-label="An animated human and their shadow in an office break room"></canvas>
      <div id="ov" class="ov"></div>
    </div>
    <div id="play-panel" class="play-panel">
      <div id="line" class="line" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="opts" class="opts" aria-label="Your choices"></div>
    </div>
  </section>
  <footer><p class="hint" id="hint">Take your time. The coffee can wait.</p></footer>
</main>
<dialog id="dialogue-log" aria-labelledby="log-title">
  <div class="dialog-heading"><h2 id="log-title">The conversation so far</h2><button id="close-log" type="button" autofocus>Back to the moment</button></div>
  <div id="log-content"></div>
</dialog>
</body>
</html>

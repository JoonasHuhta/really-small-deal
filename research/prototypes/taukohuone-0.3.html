<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Break Room – prototype</title>
<style>
:root{--bg:#1b1922;--panel:#26232f;--ink:#ece7dc;--mute:#a39cae;--accent:#e2b04a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;gap:10px}
header strong{font-size:18px;letter-spacing:.02em}
header .sub{color:var(--mute);font-size:13px}
header .sp{flex:1}
header button{background:none;border:1px solid #4a4558;color:var(--mute);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
header button:hover{color:var(--ink);border-color:var(--mute)}
.stage{position:relative}
canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:10px;background:#000;cursor:pointer}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,17,28,.86);border-radius:10px;padding:16px;overflow:auto}
.ov.on{display:flex}
.card{max-width:540px;text-align:center}
.card h1{margin:0 0 6px;font-size:34px;font-weight:700}
.card h2{margin:0 0 10px;font-size:22px}
.card p{margin:8px 0;line-height:1.5;color:#d8d2c6}
.card .small{font-size:13px;color:var(--mute)}
.card ul{list-style:none;padding:0;margin:12px 0;line-height:1.7;color:#d8d2c6}
.go{background:var(--accent);color:#1b1922;border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin:10px 4px 4px}
.go.alt{background:none;border:1px solid #5a5468;color:var(--ink);font-weight:500;font-size:13px;padding:7px 12px}
.line{min-height:52px;background:var(--panel);border:1px solid #3d3849;border-radius:12px;padding:10px 14px;font-size:16px;line-height:1.4}
.line b{font-size:12px;letter-spacing:.08em;color:var(--accent);margin-right:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--panel);color:var(--ink);border:1px solid #4a4558;border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;text-align:left;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt i{font-style:normal;color:var(--accent);font-weight:700;margin-right:10px}
.opt.cont{text-align:center;font-weight:700}
.opt:disabled{opacity:.35;cursor:default}
.hint{margin:0;color:var(--mute);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <strong>The Break Room</strong><span class="sub">prototype 0.3</span><span class="sp"></span>
    <button id="pause" type="button">Pause</button>
    <button id="restart" type="button">Restart</button>
  </header>
  <div class="stage">
    <canvas id="c"></canvas>
    <div id="ov" class="ov"></div>
  </div>
  <div id="line" class="line"></div>
  <div id="opts" class="opts"></div>
  <p class="hint">Click, Space or Enter to continue · 1–4 to choose what the shadow says</p>
</div>
<script>
(function(){
'use strict';

function approach(v,t,d){return v<t?Math.min(t,v+d):Math.max(t,v-d);}
function ease(v,t,k){return v+(t-v)*Math.min(1,k);}

/* ================= state ================= */
function reset(day){
  var r=day;

  lastDay=r;
  G={time:0,day:r,clock:9*3600+41*60+12,rate:1,started:false,ended:false,
     human:{x:HOME,xT:HOME,flinch:0,gone:false,face:'neutral',back:false},
     morko:{s:1,sT:1,off:-70,mood:'calm',st:'free',pose:null,h:[{x:340,y:380},{x:420,y:380}]},
     gaze:0,gazeT:0,gazeFrom:'A',dark:0,darkT:0,flash:0,anx:0,
     ax:1010,axT:1010,bx2:1090,bxT:1090,aFace:-1,bFace:-1,aWave:false,cowA:false,cowB:false,cupLeft:false,
     cz:1.025,cx:W/2,cy:H/2,
     lines:[],band:null,out:null,w:null,card:0,
     hud:false,plan:false,prevented:0,pop:null,real:0,lunch:0,startles:0,fear:1,leak:'none',advice:0};
  Q=[];WAIT=null;CH=null;C.z=1.025;C.fx=W/2;C.fy=H/2;
  hideOv();render();
}

/* ================= script engine ================= */
function run(){
  for(;;){
    if(!Q.length){WAIT=null;render();return;}
    var s=Q.shift();
    if(typeof s==='function'){var r=s();if(r&&r.length)Q=r.concat(Q);continue;}
    if(Array.isArray(s)){setLine(s[0],s[1]);WAIT='click';LOCK=0.3;render();return;}
    if(s.wait!=null){WAIT='time';TIMER=s.wait;render();return;}
    if(s.choice){CH=typeof s.choice==='function'?s.choice():s.choice;WAIT='choice';LOCK=0.4;render();return;}
  }
}
function advance(){if(paused||WAIT!=='click'||LOCK>0)return;run();}
function choose(i){
  if(paused||WAIT!=='choice'||LOCK>0||!CH||!CH[i])return;
  var o=CH[i];CH=null;if(o.f)o.f();

function setLine(who,text){
  var g=G;

  else{g.band=null;g.lines=g.lines.filter(function(l){return l.who!==who;});g.lines.push({who:who,text:text});if(g.lines.length>2)g.lines.shift();}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function render(){

  }else{
    elLine.innerHTML=cur&&g.started&&!g.ended?(NAMES[cur.who]?'<b>'+NAMES[cur.who]+'</b>':'')+esc(cur.text):'&nbsp;';
    html='<button class="opt cont" type="button" data-i="go"'+(WAIT==='click'?'':' disabled')+'>Continue ▸</button>';
  }
  elOpts.innerHTML=html;
}
elOpts.addEventListener('click',function(e){
  var t=e.target;while(t&&t!==elOpts&&!(t.getAttribute&&t.getAttribute('data-i')))t=t.parentNode;
  if(!t||t===elOpts)return;var i=t.getAttribute('data-i');

  set({clr:1}),

  ['A','oh, hi.'],

  ['S','Okay. Nobody panic. I’ve reviewed the “oh”.'],

  ['S','It was a verdict. I just need to work out which one.'],

  ['S','—and after that we—'],
  frozen,{wait:0.9},
  ['S','…Is that me?'],
  ['H','That’s you.'],
  hide,
  ['S','I’m ENORMOUS. Why did nobody say.'],
  pokka,
  ['S','Anyway. I was demonstrating scale.'],
  free,
  ['H','It’s been two seconds.'],
  ['S','A lot can happen in two seconds. I just did all of it.'],
  ['S','Recommendation.'],
  {choice:[
    {t:'Become furniture. Furniture is never rejected.',f:function(){G.leak='grow';},then:[['H','For how long?'],['S','Until retirement.'],prevent('furniture')]},
    {t:'Look at the cup. The cup has never judged us.',f:function(){G.leak='cover';},then:[['H','It’s a cup.'],['S','Exactly.'],prevent('cup')]},
    {t:'Leave. Via the window.',f:function(){G.leak='exit';},then:[['H','We’re on the fourth floor.'],['S','Door, then. Briskly.'],prevent('door')]},
    {t:'…Say “hi” back. Like an amateur.',f:function(){G.leak='none';},then:[['S','I want it on record that I object.'],['H','Noted.']]}
  ]},
  function(){

  function(){var g=G;g.rate=1;calm();if(g.leak==='cover'&&g.day==='C')g.morko.pose='cover';if(g.leak==='grow'&&g.day!=='A')g.human.face='stiff';},
  {wait:0.6},

var OUTCAP={none:'A nod. A “hi”. Some coffee.',grow:'Stood very still. Then a slightly too loud hi.',cover:'Looked into the cup.',exit:'Left. The coffee stayed.'};
function lunch(n){return function(){G.lunch=n;};}
var CTAIL={
  seen:[set({s:1.1,mood:'care',anx:0.05}),['S','…I didn’t make that one up.'],['H','No.'],set({pose:'comfort',face:'down'}),['S','I’d like it noted that I don’t enjoy being right.'],['H','Noted.']],

  exit:[['N','Only the empty room heard that. The shadow would call it a win. It doesn’t feel like one.']]
};

 B_none:function(){return [['S','Good. We said hi. We survived. Let’s never speak again.'],['H','I’m going to ask.'],['S','Don’t.'],set({flinch:0.6,aFace:-1,pose:'selfeyes'}),['H','Sanna. Do you want to get lunch?'],['A','Oh! Yes. I never know if you want company.'],set({pose:null,mood:'surprised'}),['S','…She thought WE didn’t want HER?'],set({face:'smile'}),['H','Twelve?'],['A','Twelve.'],lunch(1)];},

function realObs(){
  var g=G;
  if(g.day==='A')return [['S','For the record. She asked you to lunch.'],['H','She did.'],['S','Unprompted. I checked for prompts.'],set({face:'smile'}),['H','It was a good lunch.'],['S','It was adequate. I counted three laughs. Two were yours.']];

  var g=G,o=[];
  if(!done.oh)o.push({t:'Review the “oh”. Again.',f:function(){done.oh=1;g.w.speed=0;g.morko.sT=1.7;g.morko.mood='stern';},then:[

    else if(l.who==='A')bubble(g.ax,FEETY-172,l.text);
    else if(l.who==='B')bubble(g.bx2,FEETY-172,l.text);
    else if(l.who==='P')bubble(g.w?g.human.x+210:170,g.w?330:340,l.text,{noTail:true});
    ctx.restore();
  }
}

/* ================= drawing: scenes ================= */
function drawOutside(){
  var g=G,o=g.out,t=o.t,an=o.anim;
  room(true);
  var hx=g.human.xT<0?HOME:g.human.x,h={body:'#c98f2e',hair:'#4a3b32',facing:1,cup:true,face:'neutral'};
  var aFace=1,aWave=false,show=true;
  if(an==='none'){h.nod=(t>0.5&&t<1.3)?Math.sin((t-0.5)/0.8*Math.PI):0;h.sip=t>2.2&&t<3.6?Math.sin((t-2.2)/1.4*Math.PI):0;}
  else if(an==='nod'){h.nod=(t>0.5&&t<1.3)?Math.sin((t-0.5)/0.8*Math.PI):(t>1.6&&t<2.4)?Math.sin((t-1.6)/0.8*Math.PI):0;}
  else if(an==='grow'){h.face='stiff';h.flinch=t<1.9?0.8:0.25;h.shake=t<2.8;}
  else if(an==='cover'){h.face='down';h.down=true;if(g.day!=='C'&&t>1&&t<2.8){aFace=-1;aWave=true;}}
  else if(an==='exit'){hx=300-t*110;h.back=true;h.cup=false;h.walk=true;show=hx>-40;if(t>2.6)aFace=-1;}
  if(an!=='exit'){ctx.fillStyle='rgba(60,56,66,.16)';ctx.beginPath();ctx.ellipse(hx-34,WALLY-64,20,58,0,0,Math.PI*2);ctx.fill();}
  else{ctx.fillStyle='#fffdf6';ctx.strokeStyle='#2b2733';ctx.lineWidth=1.5;rr(650,406,12,14,2);ctx.fill();ctx.stroke();}
  if(show)person(hx,h);
  if(g.cowA)person(g.ax,{body:SANNA.body,hair:SANNA.hair,facing:aFace,wave:aWave});
  if(g.cowB)person(g.bx2,{body:MIKA.body,hair:MIKA.hair,facing:an==='nod'?-1:g.bFace,cup:true});
  if(an==='none'&&t>0.6&&t<1.9)bubble(hx,FEETY-172,'hi');
  if(an==='grow'&&t>1.9&&t<3.3)bubble(hx,FEETY-172,'HI.');
  ctx.fillStyle='#0f0d14';ctx.fillRect(0,0,W,56);ctx.fillRect(0,H-64,W,64);
  ctx.fillStyle='#f1ebdd';ctx.textBaseline='middle';ctx.textAlign='left';ctx.font='700 18px system-ui,sans-serif';ctx.fillText(o.title,28,29);
  ctx.textAlign='right';ctx.font='500 16px system-ui,sans-serif';ctx.fillStyle='#b9b2a6';ctx.fillText(o.dur,W-28,29);
  if(t>2.2){ctx.textAlign='center';ctx.fillStyle='#f1ebdd';ctx.font='500 20px system-ui,sans-serif';ctx.fillText(o.cap,W/2,H-32);}
}
function drawWalk(){
  var g=G,w=g.w,cam=w.x-400,i,sx;
  ctx.fillStyle='#12152a';ctx.fillRect(-20,-20,W+40,140);
  ctx.fillStyle='#f6f1e4';for(i=0;i<14;i++){var stx=((i*173-cam*0.05)%1000+1000)%1000-20;circ(stx,14+(i*37)%90,1.2);ctx.fill();}
  ctx.fillStyle='#3d4460';ctx.fillRect(-20,120,W+40,WALLY-120);
  ctx.fillStyle='#343a52';for(i=0;i<9;i++){sx=((i*130-cam)%1170+1170)%1170-105;ctx.fillRect(sx,120,4,WALLY-120);}
  ctx.fillStyle='#2a2e40';ctx.fillRect(-20,WALLY,W+40,H-WALLY+20);
  ctx.fillStyle='#232636';ctx.fillRect(-20,WALLY-5,W+40,5);
  var hx=HOMEX+60-cam;
  if(hx<W+200){ctx.fillStyle='#57405a';ctx.fillRect(hx-130,90,360,WALLY-90);
    ctx.fillStyle='#f3d27a';rr(hx+110,200,70,70,4);ctx.fill();
    ctx.fillStyle='#7a4f3c';rr(hx-34,WALLY-158,72,158,6);ctx.fill();ctx.fillStyle='#e2b04a';circ(hx+26,WALLY-78,4);ctx.fill();}
  for(i=0;i<LAMPS.length;i++){
    sx=LAMPS[i]-cam;if(sx<-320||sx>W+320)continue;
    var home=i===LAMPS.length-1,ly=home?190:150,lx=home?sx:sx+26;
    var gr=ctx.createRadialGradient(lx,ly+60,8,lx,ly+60,300);gr.addColorStop(0,'rgba(255,221,140,.5)');gr.addColorStop(1,'rgba(255,221,140,0)');
    ctx.save();ctx.beginPath();ctx.rect(-20,120,W+40,H);ctx.clip();ctx.fillStyle=gr;ctx.fillRect(lx-300,ly-240,600,600);ctx.restore();
    if(!home){ctx.strokeStyle='#1b1d2a';ctx.lineWidth=6;ctx.lineCap='round';line(sx,WALLY,sx,150);line(sx,150,sx+26,150);}
    ctx.fillStyle='#ffe9a8';circ(lx,ly+4,home?7:9);ctx.fill();
  }
  drawPair({walk:g.walking});
}
function hhmm(s){var h=Math.floor(s/3600)%24,m=Math.floor(s/60)%60;return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function hud(){
  var g=G,y=20,rows=[['SHADOW’S JOB','Keep your human from being rejected.']];
  if(g.plan)rows.push(['HUMAN’S PLAN','Ask Sanna to lunch.']);
  rows.push(['REJECTIONS PREVENTED',String(g.prevented)]);
  if(g.w)rows.push(['TIME',hhmm(g.clock)]);
  ctx.textAlign='left';ctx.textBaseline='middle';
  for(var i=0;i<rows.length;i++){
    ctx.font='700 11px system-ui,sans-serif';var w1=ctx.measureText(rows[i][0]).width;
    ctx.font='500 13px system-ui,sans-serif';var w2=ctx.measureText(rows[i][1]).width;
    var x=W-14-(w1+w2+30);
    ctx.fillStyle='rgba(22,19,30,.72)';rr(x,y-11,w1+w2+30,22,11);ctx.fill();
    ctx.font='700 11px system-ui,sans-serif';ctx.fillStyle='#e2b04a';ctx.fillText(rows[i][0],x+10,y);
    ctx.font='500 13px system-ui,sans-serif';ctx.fillStyle='#f1ebdd';ctx.fillText(rows[i][1],x+18+w1,y);
    y+=26;
  }
  if(g.pop){ctx.globalAlpha=clamp(2.6-g.pop.t,0,1);ctx.textAlign='right';ctx.font='700 14px system-ui,sans-serif';ctx.fillStyle='#e2b04a';ctx.fillText(g.pop.text,W-20,y+4-Math.min(8,g.pop.t*10));ctx.globalAlpha=1;}
}
function draw(){
  var g=G;
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(g.out){drawOutside();return;}
  ctx.save();applyCamera();
  if(g.w){drawWalk();drawLines();}
  else{
    room(false);
    if(g.dark>0.01){ctx.fillStyle='rgba(18,14,30,'+(0.45*g.dark)+')';ctx.fillRect(-20,-20,W+40,H+40);}
    if(g.gaze>0.01&&!g.human.gone){var gx=g.gazeFrom==='B'?g.bx2:g.ax;ctx.fillStyle='rgba(255,246,200,'+(0.34*g.gaze)+')';ctx.beginPath();ctx.moveTo(gx-14,FEETY-150);ctx.lineTo(g.human.x+16,FEETY-176);ctx.lineTo(g.human.x+16,FEETY);ctx.closePath();ctx.fill();}
    if(!g.human.gone)drawPair();
    drawCoworkers(g.dark>0.5?0.75:1);
    drawLines();
  }
  ctx.restore();
  if(g.flash>0.01){ctx.fillStyle='rgba(255,250,235,'+((RM?0.15:0.55)*g.flash)+')';ctx.fillRect(0,0,W,H);}
  ctx.textBaseline='middle';
  if(g.hud&&g.started)hud();
  if(g.w){
        if(g.card>0){ctx.textAlign='center';ctx.fillStyle='#f1ebdd';ctx.font='700 30px system-ui,sans-serif';ctx.fillText('THE WALK HOME',W/2,74);
      ctx.font='500 17px system-ui,sans-serif';ctx.fillStyle='#b9b2a6';ctx.fillText('Nine minutes, usually.',W/2,106);}
  }
  if(g.band)band(g.band,H-18);
  if(paused){ctx.fillStyle='rgba(18,14,30,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f1ebdd';ctx.font='700 28px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Paused',W/2,H/2);}
}

/* ================= overlays ================= */
function showOv(html){ov.innerHTML='<div class="card">'+html+'</div>';ov.className='ov on';}
function hideOv(){ov.className='ov';ov.innerHTML='';}
function showTitle(){
  showOv('<h1>The Break Room</h1><p class="small">Prototype 0.3 · about five minutes · no sound</p>'+
   '<p>You are a shadow. You have one job: keep your human from being rejected. By anyone. Ever.</p>'+
   '<p>You choose what the shadow says.</p>'+
   '<button class="go" type="button" data-go="start">Start</button>');
}
var DAYNAME={A:'benign',B:'sensitive',C:'dismissive'};
function showEnd(){
  var g=G,n=g.startles;g.ended=true;WAIT=null;Q=[];render();
  var lunchTxt=g.lunch===1?'1':g.lunch===2?'0 (1 pending, tomorrow)':'0';
  showOv('<h2>Shadow’s daily report</h2>'+
   '<ul><li>Rejections prevented: '+g.prevented+'</li>'+
   '<li>Rejections that happened anyway: '+g.real+'</li>'+
   '<li>Lunches attended: '+lunchTxt+'</li>'+
   '<li>Times I scared myself: '+n+' (do not circulate)</li>'+
   '<li>Duration of “oh, hi”: 2 seconds. Review of “oh, hi”: ongoing.</li></ul>'+
   '<p>The same “oh, hi” can belong to three different days. The shadow can’t tell which. Neither can you.</p>'+
   '<button class="go" type="button" data-go="again">Another day</button>'+
   '<p class="small">For the designer: today was <b>'+DAYNAME[g.day]+'</b>. “Another day” and the buttons below skip to Sanna’s entrance.</p>'+
   '<button class="go alt" type="button" data-go="A">Benign</button><button class="go alt" type="button" data-go="B">Sensitive</button><button class="go alt" type="button" data-go="C">Dismissive</button>');
}
function startGame(day,skip){
  reset(day);G.started=true;
  if(skip){G.bx2=G.bxT=880;Q=scSanna();}
  else Q=scIntro().concat([function(){return scSanna();}]);
  run();
}
ov.addEventListener('click',function(e){
  var t=e.target;while(t&&t!==ov&&!(t.getAttribute&&t.getAttribute('data-go')))t=t.parentNode;
  if(!t||t===ov)return;var go=t.getAttribute('data-go');
  if(go==='start')startGame(null,false);
  else if(go==='again')startGame(null,true);
  else startGame(go,true);
});

/* ================= input ================= */
window.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Enter'){
    if(!G.started){startGame(null,false);}else advance();
    e.preventDefault();
  }else if(e.key>='1'&&e.key<='4'){choose(+e.key-1);}
  else if(e.key==='p'||e.key==='P'){togglePause();}
});
function togglePause(){if(!G.started||G.ended)return;paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause';}
document.getElementById('pause').addEventListener('click',togglePause);
document.getElementById('restart').addEventListener('click',function(){paused=false;document.getElementById('pause').textContent='Pause';reset(null);showTitle();});
document.addEventListener('visibilitychange',function(){if(document.hidden&&!paused)togglePause();});

/* ================= loop ================= */
var last=0;
function frame(ts){
  var dt=clamp((ts-last)/1000||0,0,0.05);last=Math.max(last,ts);
  if(!paused)update(dt);
  draw();
  window.requestAnimationFrame(frame);
}
resize();reset(null);showTitle();
window.__T={get G(){return G;},start:startGame,frame:frame,advance:advance,choose:choose,state:function(){return WAIT;},nopts:function(){return CH?CH.length:0;},unlock:function(){LOCK=0;}};
window.requestAnimationFrame(frame);
})();
</script>
